<script type="text/javascript" src="./node_modules/bitwrench/bitwrench.min.js"></script>
<script type="text/javascript" src="./jado.js"></script>

</head>

<body class="bw-def-page-setup bw-font-sans-serif">
<div class="bw-container">
<div class="bw-col-10">

<img src="./icon/jado-logo-rocket.png" width="400"></img>
<h1>Jado Auto Docs Page</h1>
<p id="versionArea"></p>
<br>
jado applies map, filter, and reduce to a single value, an array, or a plain object. A single value stays a single value. It has no dependencies.
<br><br>



<!-- function list area -->
<h1 class="bw-h1">Function List</h1>
These functions are on jado.
<div id="bwFunctionListID"></div> <!-- this list is dynamically generated, see javscript below -->
<br>
</div>

<div class="bw-center" style="font-size: 9pt">JADO auto docs page</div><br>
<script type="text/javascript">
	
	bw.DOM("#versionArea","<strong>JADO.js version: </strong>" + jado.version()["version"]);
	//draw the bitwrench function list (drawn dynamically from the built-in doc strings)
	var funcList=[],i;
	for (i in jado) {
		if (bw.typeOf(jado[i])=="function") {
			funcList.push(["div" ,{"class":"bw-col-10"}, [
				"<hr>",
				["h3"  ,{"class":"bw-h3 color-set1", "id":"bw_func_"+i, "style":"color: #006666;"},"jado."+i+"()"], 
				["p"   ,{"class":"bw-code"}, bw.docString(jado[i],{dropLeadin:false})[0]], // makes use of self-parsing of docString data 
				"<br>"
			    ]]);
		}
	}
	// funcList = funcList.sort(function(a,b){return bw.naturalSort(a,b)});
	bw.DOM("#bwFunctionListID", bw.html(["p",{"class":"bw-col-6"}, funcList]));

	
</script>

</body>
</html>
